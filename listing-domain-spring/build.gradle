// Listing domain types for the Spring Boot port (§8 `listing-domain`; "-spring" while the Maven
// listing-domain module still exists). P2.1 content: the listing-domain-common types copied as they
// are (javax.json -> jakarta.json), the two generated enums the viewstore uses
// (uk.gov.justice.listing.event.PublishCourtListType/PublishStatus), and framework-free
// replacements for the Justice Services JSON helpers (uk.gov.moj.cpp.listing.domain.json).
dependencies {
    api 'com.fasterxml.jackson.core:jackson-databind'
    api 'com.fasterxml.jackson.core:jackson-annotations'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8'
    api 'jakarta.json:jakarta.json-api:2.1.3'
    api 'org.apache.commons:commons-lang3'
    implementation 'org.slf4j:slf4j-api'
    implementation 'com.google.guava:guava:33.6.0-jre'
    runtimeOnly 'org.eclipse.parsson:parsson:1.1.9'

    testImplementation 'org.assertj:assertj-core'
    testRuntimeOnly 'org.eclipse.parsson:parsson:1.1.9'
}

// Parameter names in class files, for the framework-equivalent ObjectMapper's ParameterNamesModule.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}
