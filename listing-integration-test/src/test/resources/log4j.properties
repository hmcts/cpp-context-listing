# Root logger option: WARN for libraries, INFO for the IT helpers (retry loops, quiesce, purge)
log4j.rootLogger=WARN, stdout
log4j.logger.uk.gov.moj.cpp.listing=INFO
log4j.logger.uk.gov.justice.services.test.utils.persistence=INFO

# Uncomment the below entries to show SQL queries during JUnit test
# log4j.logger.org.hibernate=info
# log4j.logger.org.hibernate.SQL=debug
# log4j.logger.org.hibernate.type.descriptor.sql=trace

# Direct log messages to stdout
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n