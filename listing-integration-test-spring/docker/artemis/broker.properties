# Artemis broker properties for the Spring IT stack (MBD refactor P2.2, ADR 013). The image copies
# etc-override/* into the broker's etc directory, where broker.properties is applied on top of
# the generated broker.xml.
#
# Redelivery / dead-lettering, stated explicitly so the ITs do not depend on image defaults. The
# values match the CPP brokers (cpp-developers-docker broker.xml: Artemis default
# max-delivery-attempts 10, redelivery-delay 0); only the DLQ address differs: CPP brokers
# dead-letter to jms.queue.DLQ, this image's default DLQ address is DLQ (§15.3 default).
addressSettings."#".maxDeliveryAttempts=10
addressSettings."#".redeliveryDelay=0
addressSettings."#".deadLetterAddress=DLQ
