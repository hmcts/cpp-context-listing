// Listing payload DTOs for the Spring Boot port (MBD refactor; §8 `listing-domain`, "-spring" while
// the Maven listing-domain-event module still exists).
//
// ADR 015: the Spring application has no aggregates and no private events. These generated POJOs
// are kept ONLY as payload DTOs (e.g. the core.courts types and the court-list public message
// shape, uk.gov.justice.listing.courts.events.CourtLists, which the JEE processor round-tripped the
// public payload through). Private-event classes (uk.gov.justice.listing.event(s).*) are still in
// the vendored set because the core/listing types reference each other, but they are never
// stored or published: EventOutbox accepts public.* names only.
//
// The sources under src/generated/java are VENDORED, not hand-written: the output of the
// framework's pojo-generation-plugin as the Maven modules run it (listing-domain-event, plus the
// five classes of uk.gov.justice.listing.courts.events that listing-event-processor generates from
// public.listing.court-list-published.json), with the framework's @Event annotation stripped so
// that framework-api-domain is not on the classpath (§12, D32). There is no Gradle port of that
// generator (jsonschema2pojo produces different classes). Refresh with
// ./refresh-generated-sources.sh whenever a schema changes (until P2.6).
//
// PublishCourtListType and PublishStatus (package uk.gov.justice.listing.event) are not vendored
// here: listing-domain-spring already has them (P2.1), identical.
sourceSets {
    main {
        java.srcDirs = ['src/generated/java']
        resources.srcDirs = []
    }
}

dependencies {
    api project(':listing-domain-spring')
    implementation 'org.apache.commons:commons-lang3'
    implementation 'commons-collections:commons-collections:3.2.2'
    api 'com.fasterxml.jackson.core:jackson-annotations'

    testImplementation 'org.assertj:assertj-core'
}

// The generated classes use @JsonCreator constructors without @JsonProperty: Jackson needs the
// parameter names (ParameterNamesModule in the framework-equivalent ObjectMapper).
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
    // Generated code: no lint noise.
    options.compilerArgs.remove('-Xlint:unchecked')
}
