# Actuator: health, info, prometheus, metrics under /actuator (i.e. /listing-service/actuator,
# because of the servlet context path). Copied from courtscheduler.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
