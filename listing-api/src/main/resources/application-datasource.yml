# Datasource, JPA and Liquibase (P2.1). Copied from courtscheduler's application-datasource.yml with
# the LISTING_* env var prefix (D12). The schema is the existing viewstore Liquibase changelog
# (listing-viewstore-liquibase, reused unchanged, including the Phase 1 changesets 028-030).
spring:
  datasource:
    url: ${LISTING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/listingviewstore}
    username: ${LISTING_DATASOURCE_USERNAME:listing}
    password: ${LISTING_DATASOURCE_PASSWORD:listing}
    driver-class-name: ${LISTING_DATASOURCE_DRIVER:org.postgresql.Driver}
    hikari:
      pool-name: listing-hikari
      maximum-pool-size: ${LISTING_DB_POOL_SIZE:20}
      minimum-idle: ${LISTING_DB_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 300000
      validation-timeout: 5000
      # MUST stay true (§6): with auto-commit=false, reads outside a transaction leave connections
      # "idle in transaction" until Postgres kills them (courtscheduler). Spring/Hibernate still
      # switch it off inside managed transactions.
      auto-commit: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
      naming:
        # The DeltaSpike entities ran on Hibernate 5 without a naming strategy: unannotated fields
        # and @Column names (e.g. Hearing.totalCount, CaseByDefendant "caseId") are used as written,
        # matching the column aliases of the native queries. Spring Boot's default snake_case
        # strategy would rename them.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    properties:
      hibernate.jdbc.time_zone: UTC
      # java.time values are stored normalised to UTC, as the WildFly JVM (UTC) did with Hibernate 5.
      hibernate.timezone.default_storage: NORMALIZE_UTC
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true

  sql:
    init:
      mode: never

  liquibase:
    enabled: ${LISTING_LIQUIBASE_ENABLED:true}
    # Set explicitly: the legacy liquibase.properties (Maven plugin config) is not used (courtscheduler REVIEW).
    change-log: classpath:liquibase/db-changelog.xml
