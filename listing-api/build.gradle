// Spring Boot application for the listing context (MBD refactor, Phase 2). Copied from
// courtscheduler's listingcourtscheduler-api/build.gradle (ADR 007). P2.0: web plumbing, authz,
// audit, envelope, schema validation, actuator and JSON logging. P2.1: persistence (JPA,
// Liquibase, Postgres) and the query controllers over listing-common-spring's query services.
// P2.2: domain messaging (listing-messaging: outbox relay, public.event publisher and listener).
plugins {
    id 'application'
    id 'org.springframework.boot'
    id 'org.openapi.generator'
    id 'org.cyclonedx.bom'
    id 'com.gorylenko.gradle-git-properties'
    id 'maven-publish'
    id 'jacoco'
}

ext {
    serverPort = project.findProperty('server.port') ?: '8084'
}

/* ---------------- OpenAPI server stubs ----------------
 * One spec for both context roots (ADR 008): paths are relative to the /listing-service
 * servlet context path and start with /command/api/rest/listing or /query/api/rest/listing. */
openApiGenerate {
    generatorName = 'spring'
    inputSpec = "${projectDir}/src/main/resources/openapi/listing-api.openapi.yml".toString()
    outputDir = "$buildDir/generated/openapi".toString()
    apiPackage = 'uk.gov.moj.cpp.listing.openapi.api'
    modelPackage = 'uk.gov.moj.cpp.listing.openapi.model'
    invokerPackage = 'uk.gov.moj.cpp.listing.openapi.invoker'
    apiNameSuffix = 'OpenApi'
    configOptions = [
            interfaceOnly       : 'true',
            useSpringBoot3      : 'true',
            useTags             : 'true',
            useJakartaEe        : 'true',
            dateLibrary         : 'java8',
            openApiNullable     : 'false',
            skipDefaultInterface: 'true',
            useResponseEntity   : 'true'
    ]
}

sourceSets.main.java.srcDir "$buildDir/generated/openapi/src/main/java"
tasks.named('compileJava') { dependsOn tasks.named('openApiGenerate') }

/* ---------------- Legacy JSON schemas used for request validation ----------------
 * The RAML request schemas are reused unchanged (§6). Until the JEE modules are deleted (P2.6)
 * they stay where the Maven build reads them; processResources copies them onto the classpath.
 * Their remote $refs (http://justice.gov.uk/...) are resolved from a classpath catalog built
 * from the same sources the framework's schema catalog used: listing-json (copied below) and the
 * core-domain schemas those refs reach, vendored under
 * src/main/resources/request-schemas/catalog/vendored-core-domain (D22; see the README there). */

/* ---------------- Dependencies ---------------- */
dependencies {
    // P2.1: query services, viewstore persistence, Liquibase changelogs (runtime resources only).
    implementation project(':listing-common-spring')
    implementation project(':listing-viewstore-persistence-spring')
    runtimeOnly project(':listing-viewstore-liquibase')
    // P2.2: domain messaging (ADR 013).
    implementation project(':listing-messaging')
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.postgresql:postgresql'
    implementation 'org.liquibase:liquibase-core'
    implementation 'org.springframework.boot:spring-boot-liquibase'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'io.swagger.core.v3:swagger-annotations:2.2.52'
    implementation 'jakarta.validation:jakarta.validation-api:3.1.1'
    implementation 'jakarta.servlet:jakarta.servlet-api:6.1.0'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.11'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Draft-04 JSON Schema validation of inbound request bodies, using everit (the same library
    // the legacy framework used) for exact parity — see RequestSchemaValidationFilter.
    implementation "com.github.erosb:everit-json-schema:${everitJsonSchemaVersion}"
    // OpenAPI spec reader for the media type → legacy schema mapping (x-json-schema).
    implementation 'org.yaml:snakeyaml'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'

    // JSON logging to stdout (logback-spring.xml, §15.9).
    implementation 'net.logstash.logback:logstash-logback-encoder:9.0'
    implementation 'org.apache.logging.log4j:log4j-to-slf4j'
    implementation 'ch.qos.logback:logback-classic'
    implementation 'ch.qos.logback:logback-core'

    implementation 'jakarta.json:jakarta.json-api:2.1.3'
    runtimeOnly 'org.eclipse.parsson:parsson:1.1.9'

    // Same Guava as courtscheduler; also overrides the 32.x-android that swagger-parser (via the audit filter) asks for.
    implementation 'com.google.guava:guava:33.6.0-jre'

    implementation "uk.gov.hmcts.cp:cp-auth-rules-filter:${cpAuthFilterVersion}"
    implementation "uk.gov.hmcts.cp:cp-audit-filter-springboot:${cpAuditFilterVersion}"

    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'junit', module: 'junit'
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
    testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"
    // P2.1: @SpringBootTests need a database (Postgres in a container, as the repository tests).
    testImplementation 'org.testcontainers:testcontainers:2.0.5'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.eclipse.parsson:parsson:1.1.9'
}

springBoot {
    buildInfo {
        properties {
            name = project.name
            version = project.version.toString()
        }
    }
}

gitProperties {
    dotGitDirectory = file("${rootProject.projectDir}/.git")
    failOnNoGitDirectory = false
}

cyclonedxBom {
    includeConfigs = ["runtimeClasspath"]
    skipConfigs = ["compileClasspath", "testImplementation", "testCompileClasspath", "testRuntimeClasspath"]
    schemaVersion = "1.6"
    componentVersion = providers.provider { project.version.toString() }
    destination = layout.buildDirectory.dir("reports").get().asFile
}

jar {
    enabled = true
    archiveClassifier.set('plain')
}

bootJar {
    archiveFileName = "${rootProject.name}-${project.version}.jar"
    manifest {
        // Enable-Native-Access: Netty loads native libraries; without this the JVM prints non-JSON
        // warnings on stderr (context/logging-standards.md: JSON-only output). Java 24+ honours it
        // for executable jars.
        attributes('Implementation-Version': project.version.toString(),
                   'Enable-Native-Access': 'ALL-UNNAMED')
    }
}

application {
    mainClass = 'uk.gov.moj.cpp.listing.Application'
}

/* ---------------- Publishing ----------------
 * Publishes the Spring Boot fat jar (and the 'plain' classifier jar) to GitHub Packages and the
 * HMCTS Azure DevOps Artifacts feed as uk.gov.hmcts.cp:<repo-name>, as courtscheduler does.
 * Credentials come from env vars in CI; locally `./gradlew publishToMavenLocal` needs none. */
def githubActor = project.findProperty("github.actor") ?: System.getenv("GITHUB_ACTOR")
def githubToken = project.findProperty("github.token") ?: System.getenv("GITHUB_TOKEN")
def githubRepo  = System.getenv("GITHUB_REPOSITORY") ?: "hmcts/${rootProject.name}"

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId    = 'uk.gov.hmcts.cp'
            artifactId = rootProject.name
            version    = project.version

            artifact(tasks.named('bootJar'))
            artifact(tasks.named('jar'))

            pom {
                name = rootProject.name
                url  = "https://github.com/${githubRepo}"
            }
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url  = uri("https://maven.pkg.github.com/${githubRepo}")
            credentials {
                username = githubActor
                password = githubToken
            }
        }
        maven {
            name = "AzureArtifacts"
            url  = uri(rootProject.ext.azureADOArtifactRepository)
            credentials {
                username = rootProject.ext.azureADOArtifactActor
                password = rootProject.ext.azureADOArtifactToken
            }
        }
    }
}

/* Publishing is not idempotent: Azure Artifacts feeds are immutable (re-PUT → 409) and GitHub
 * Packages rejects re-published versions (422). Skip a repository that already holds this
 * publication's pom (copied from courtscheduler). */
tasks.withType(PublishToMavenRepository).configureEach {
    onlyIf('version not already published to this repository') { task ->
        def repo = task.repository
        def repoUrl = repo.url.toString().replaceAll('/+$', '')
        if (!repoUrl.startsWith('http')) {
            return true
        }
        def pub = task.publication
        def pomUrl = "${repoUrl}/${pub.groupId.replace('.', '/')}/${pub.artifactId}/${pub.version}/${pub.artifactId}-${pub.version}.pom"
        try {
            def conn = (HttpURLConnection) new URI(pomUrl).toURL().openConnection()
            conn.requestMethod = 'HEAD'
            if (repo.credentials?.username && repo.credentials?.password) {
                def basic = "${repo.credentials.username}:${repo.credentials.password}".getBytes('UTF-8').encodeBase64()
                conn.setRequestProperty('Authorization', "Basic ${basic}")
            }
            conn.connectTimeout = 10_000
            conn.readTimeout = 10_000
            def alreadyPublished = conn.responseCode == 200
            conn.disconnect()
            if (alreadyPublished) {
                logger.lifecycle("Skipping ${task.name}: ${pub.groupId}:${pub.artifactId}:${pub.version} is already in '${repo.name}'")
            }
            return !alreadyPublished
        } catch (Exception e) {
            logger.warn("Could not probe '${repo.name}' for existing ${pub.version} (${e.message}); publishing anyway")
            return true
        }
    }
}

tasks.named('test') {
    // Run every test class even when one fails, so the failure list is comprehensive.
    failFast = false
    // Testcontainers' Ryuk image is not needed and may not be pullable offline.
    environment 'TESTCONTAINERS_RYUK_DISABLED', 'true'
    jvmArgs += [
            "-javaagent:${configurations.testRuntimeClasspath.find { it.name.contains('mockito-core') }}", '-Xshare:off'
    ]
}

def legacyCommandSchemas = rootProject.file('listing-command/listing-command-api/src/raml/json/schema')
def legacyQuerySchemas   = rootProject.file('listing-query/listing-query-api/src/raml/json/schema')
def listingJsonSchemas   = rootProject.file('listing-json/src/main/resources/json/schema')

tasks.named('processResources') {
    // §11 pitfall 9: legacy modules ship duplicate META-INF descriptors; first one wins.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // RAML request (and query response) schemas, unchanged, for RequestSchemaValidationFilter.
    from(legacyCommandSchemas) { into 'request-schemas' }
    from(legacyQuerySchemas) { into 'request-schemas' }
    // Schemas their $refs point at (the framework's schema catalog, rebuilt on the classpath;
    // the core-domain part is vendored in src/main/resources, D22).
    from(listingJsonSchemas) { into 'request-schemas/catalog/listing-json' }
}
