// The legacy *IT suite (the scenarios of the former Maven module listing-integration-test) run against
// the Spring Boot app on the docker-compose IT stack (MBD refactor P2.3.0; §9, D1, D10; ADR 014).
// Tests only.
//
// Sources: moved here from the Maven module at P2.6 (src/test/java, src/test/resources, src/test/raml,
// unchanged). The harness classes the Maven module had and the Spring stack needs replaced (the §9
// "harness only" changes: base URI and ports, WireMock in its own container, the Artemis connection,
// the viewstore-only database, no event store) are the versions in src/test/java; the WildFly
// versions are gone (listed in ADR 014). src/generated/java and legacy-it-dependencies.txt are owned
// here (see README.md); there is no Maven build to regenerate them from any more.
//
// Run: ./runIntegrationTests.sh legacy  or
//      ./gradlew :listing-integration-test-legacy:legacyIntegrationTest [-PitClasses=ListingNoteIT,HearingIT] [--tests ...]
// The stack uses the same fixed container names and ports as listing-integration-test-spring, so the
// two suites do not run at the same time.
plugins {
    id 'java-library'
    id 'com.avast.gradle.docker-compose'
}

// The test JVM runs in build/legacy-it: the suite's FileUtil reads 'src/test/resources/...' relative to
// the working directory, and its listeners write target/... and unexpected-server-errors.txt there.
def legacyItDir = layout.buildDirectory.dir('legacy-it')
def legacyResources = layout.buildDirectory.dir('legacy-it/src/test/resources')

def syncLegacyResources = tasks.register('syncLegacyResources', Sync) {
    description = 'Copies the legacy IT resources under build/legacy-it, with the base URI of the Spring stack gateway'
    from('src/test/resources')
    // §9 base URI: endpoint.properties' base-uri (was http://localhost:8080, the cpp-developers-docker gateway).
    filesMatching('endpoint.properties') {
        filter { String line -> line.startsWith('base-uri=') ? "base-uri=${project.findProperty('legacy.baseUri') ?: 'http://localhost:8192'}" : line }
    }
    into legacyResources
}

// The listing-json schemas (now under listing-api/src/listing-json) were on the Maven test classpath.
def listingJsonSchemas = project(':listing-api').file('src/listing-json')
// The public message contract (schemas + publications descriptor, listing-messaging/src/contract).
def publicContractDir = project(':listing-messaging').file('src/contract')
// Every public.* message the app published during legacyIntegrationTest (PublicMessageRecorder).
def recordedPublicMessages = layout.buildDirectory.dir('legacy-it/public-messages')

sourceSets {
    main {
        java.srcDirs = []
        resources.srcDirs = []
    }
    test {
        java.srcDirs = ['src/test/java', 'src/generated/java']
        resources.srcDirs = [legacyResources, listingJsonSchemas]
    }
}

tasks.named('compileTestJava') {
    options.compilerArgs.remove('-Xlint:unchecked')
    options.compilerArgs << '-nowarn'
    options.encoding = 'UTF-8'
}
tasks.named('processTestResources') {
    dependsOn syncLegacyResources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar { enabled = false }

// The framework/HMCTS test jars (uk.gov.*) are resolved as plain artifacts: their POMs inherit from
// service-parent-pom / platform-libraries-bom, which Gradle cannot parse offline, and the list is
// already the flat, resolved Maven classpath. Everything else resolves normally.
repositories.clear()
repositories {
    maven {
        name = 'localMavenArtifactsOnly'
        url = new File(System.getProperty('user.home'), '.m2/repository').toURI()
        metadataSources { artifact() }
        content { includeGroupByRegex 'uk\\.gov\\..*' }
    }
    maven {
        name = 'hmctsArtifactsOnly'
        url = rootProject.ext.azureADOArtifactRepository
        metadataSources { artifact() }
        content { includeGroupByRegex 'uk\\.gov\\..*' }
        if (rootProject.ext.azureADOArtifactActor && rootProject.ext.azureADOArtifactToken) {
            credentials {
                username = rootProject.ext.azureADOArtifactActor
                password = rootProject.ext.azureADOArtifactToken
            }
        }
    }
    mavenLocal { content { excludeGroupByRegex 'uk\\.gov\\..*' } }
    mavenCentral()
}

dependencies {
    // The former Maven module's resolved test classpath, exact versions, non-transitive (README.md).
    file('legacy-it-dependencies.txt').readLines()
            .findAll { it && !it.startsWith('#') }
            .each { coordinates -> testImplementation(coordinates) { transitive = false } }

    // The listing reactor modules the Maven suite depended on, replaced by their Gradle ports (classes only).
    testImplementation(project(':listing-domain-spring')) { transitive = false }
    testImplementation(project(':listing-domain-event-spring')) { transitive = false }
    testImplementation(project(':listing-viewstore-persistence-spring')) { transitive = false }
    testCompileOnly 'jakarta.persistence:jakarta.persistence-api'
    // JUnit: the Gradle build's JUnit 6 (root build) plus the launcher API (the suite's listeners)
    // and JUnit 4's Assert (used by a few steps; no JUnit 4 tests).
    testImplementation 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testImplementation('junit:junit:4.13.2') { transitive = false }
}

/* ---------------- Docker Compose: the Spring IT stack + the legacy overlay ---------------- */
tasks.named('composeBuild') { dependsOn project(':listing-api').tasks.named('bootJar') }

dockerCompose {
    useComposeFiles = ['../listing-integration-test-spring/docker/docker-compose.integration.yml',
                       'docker/docker-compose.legacy.yml']
    startedServices = ['app', 'db', 'wiremock', 'artemis', 'gateway']

    buildBeforeUp = true
    waitForTcpPorts = false
    upAdditionalArgs = ['--wait', '--wait-timeout', '180']

    captureContainersOutputToFiles = project.layout.buildDirectory.dir('legacy-it/container-logs').get().asFile
    removeOrphans = true
    stopContainers = true
    removeContainers = true

    projectName = "${rootProject.name}-legacy-it".replaceAll('[^A-Za-z0-9]', '')

    useDockerComposeV2 = true
    dockerExecutable = 'docker'
}

// The legacy suite is NOT part of `./gradlew build` (opt-in: ~22 minutes on its own stack): it has its
// own task, run by ./runIntegrationTests.sh. `test` only compiles it.
tasks.named('test') { enabled = false }

def legacyIntegrationTest = tasks.register('legacyIntegrationTest', Test) {
    description = 'Runs the legacy *IT suite (Maven listing-integration-test scenarios) against the Spring stack'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    // The suite runs against a freshly started stack: never up to date.
    outputs.upToDateWhen { false }
    dependsOn syncLegacyResources
    workingDir = layout.buildDirectory.dir('legacy-it').get().asFile

    dependsOn tasks.named('composeUp')
    finalizedBy tasks.named('composeDown')

    // As the Maven failsafe run: *IT classes only (not the *SpiScenario classes), no reruns.
    include '**/*IT.class'
    exclude '**/*SpiScenario*'
    failFast = false
    ignoreFailures = project.hasProperty('legacyIgnoreFailures')

    // -PitClasses=ListingNoteIT,HearingIT runs a subset by simple class name (or use --tests).
    def itClasses = project.findProperty('itClasses')
    if (itClasses) {
        filter {
            itClasses.toString().split(',').collect { it.trim() }.findAll { it }.each { includeTestsMatching("*.${it}") }
        }
    }

    // As failsafe: the IT JVM reads UTC (the server's zone), en_GB; optional frozen clock (ItClock).
    systemProperty 'user.timezone', 'UTC'
    systemProperty 'user.language', 'en'
    systemProperty 'user.country', 'GB'
    systemProperty 'it.clock', project.findProperty('it.clock') ?: ''

    // The Spring stack (LegacyStack): gateway, WireMock, Artemis (+ Jolokia), viewstore DB.
    systemProperty 'legacy.baseUri', project.findProperty('legacy.baseUri') ?: 'http://localhost:8192'
    systemProperty 'legacy.wiremock.host', 'localhost'
    systemProperty 'legacy.wiremock.port', '8191'
    systemProperty 'legacy.artemis.url', 'tcp://localhost:61626?user=listing&password=listing'
    systemProperty 'legacy.jolokia.url', 'http://localhost:8171/console/jolokia/'
    systemProperty 'legacy.db.url', 'jdbc:postgresql://localhost:55436/listing'
    // ServerLogTestMarkerExtension writes its markers here instead of WildFly's server.log (the app's
    // log is captured per container under build/legacy-it/container-logs).
    systemProperty 'server.log.path', layout.buildDirectory.file('legacy-it/test-markers.log').get().asFile.path
    // PublicMessageRecorder: every public.event message, for publicMessageContractTest.
    systemProperty 'legacy.publicMessages.dir', recordedPublicMessages.get().asFile.path
    // ./runIntegrationTests.sh durations: TestDurationListener's ranked durations
    // (build/legacy-it/target/test-results/test-durations.csv), as the Maven test-duration-tracking profile.
    if (project.hasProperty('itDurations')) {
        systemProperty 'enable.test.duration.tracking', 'true'
    }

    jvmArgs = ['-Xshare:off']
    finalizedBy 'publicMessageContractTest'
    reports.junitXml.outputPerTestCase = false
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'short'
        showStandardStreams = false
    }
}

// Public message contract (P2.5, §4.4, §12): validates every public.* message recorded during
// legacyIntegrationTest against the legacy public schemas, one test per published name. Runs after the
// suite (finalizedBy), without the compose stack; on its own it validates the last run's recordings.
tasks.register('publicMessageContractTest', Test) {
    description = 'Validates the public.* messages recorded by the last legacyIntegrationTest run against the legacy public schemas'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    outputs.upToDateWhen { false }
    mustRunAfter legacyIntegrationTest
    include '**/PublicMessageContractTest.class'
    // No stack here: LegacyHarnessExtension (auto-detected for the *IT classes) would initialise the WireMock stubs.
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'false'
    systemProperty 'public.contract.dir', publicContractDir.path
    systemProperty 'schema.catalog.dirs', [new File(listingJsonSchemas, 'json/schema'),
            project(':listing-api').file('src/main/resources/request-schemas/catalog/vendored-core-domain')].join(File.pathSeparator)
    // Not legacy.publicMessages.dir: that property switches PublicMessageRecorder on (it would wipe the recordings).
    systemProperty 'contract.publicMessages.dir', recordedPublicMessages.get().asFile.path
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}
