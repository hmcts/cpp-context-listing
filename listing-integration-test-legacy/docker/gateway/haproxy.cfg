# Legacy IT gateway (MBD refactor P2.3.0, §9). Reproduces the two path rules of cpp-developers-docker's
# haproxy that the legacy *IT scenarios rely on: /api/... is stripped, and /<ctx>-<component>/... (e.g.
# /listing-query-api/query/...) is rewritten to /<ctx>-service/... . Everything goes to the Spring app.
global
  maxconn 256

defaults
  mode http
  timeout connect 5s
  timeout client  60s
  timeout server  60s

frontend api-in
  bind *:8080
  acl api_strip path_beg /api/
  acl capture_services_map_acl path -m sub command-api custom-api command-controller command-handler event-api event-listener event-processor query-api query-controller query-view
  reqrep  ^([^\ :]*)\ /api(/.*) \1\ \2 if api_strip
  reqrep ^([^\ :]*\ )/([a-z]*)-[^/]+(/.*) \1/\2-service\3 if capture_services_map_acl
  default_backend app

backend app
  server app app:8084
