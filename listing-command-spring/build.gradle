// Command side of the Spring Boot port (MBD refactor P2.3; ADR 015). "-spring" while the Maven
// listing-command module still exists.
//
// ADR 015: no aggregates, no private events, no event log. Each command is a framework-free
// @Transactional service in command.<slice>: load the viewstore state → the ported aggregate guards
// → the viewstore changes the JEE event listener made → the public messages the JEE event
// processor published → EventOutbox (listing-messaging), all in one transaction. Processor steps
// that sent internal commands call the next service directly; steps that were asynchronous
// (e.g. the XHIBIT court-list export) run after commit (AfterCommit).
//
// Framework-free (§5): no JsonEnvelope, no uk.gov.justice.services.*, no framework-api-domain.
dependencies {
    api project(':listing-common-spring')
    api project(':listing-messaging')
    api project(':listing-xhibit')
    api 'org.springframework:spring-context'
    api 'org.springframework:spring-tx'
    api 'jakarta.json:jakarta.json-api:2.1.3'

    implementation 'org.slf4j:slf4j-api'
    implementation 'org.apache.commons:commons-lang3'
    implementation 'commons-collections:commons-collections:3.2.2'
    implementation 'com.google.guava:guava:33.6.0-jre'
    runtimeOnly 'org.eclipse.parsson:parsson:1.1.9'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.skyscreamer:jsonassert'
    testImplementation 'com.jayway.jsonpath:json-path-assert:2.9.0'
    testImplementation('junit:junit:4.13.2') { transitive = false }
    testImplementation 'org.hamcrest:hamcrest'
    testRuntimeOnly 'org.eclipse.parsson:parsson:1.1.9'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}
