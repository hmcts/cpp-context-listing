// Gradle build for the Spring Boot port (MBD refactor, Phase 2). It lives alongside the Maven
// build: the JEE modules (listing-command, listing-query, listing-service, ...) are still built
// by Maven until cut-over (P2.5) and deleted at P2.6. Gradle includes ONLY the new modules.
//
// Module names follow §8 of docs/MBD_REFACTOR_PROMPT.md. Where §8's directory is still taken by a
// Maven module, the Gradle module lives in a sibling directory with a "-spring" suffix (as P2.0
// did for listing-integration-test-spring); the suffix goes at P2.6 with the Maven modules.
rootProject.name = 'cpp-context-listing'

include 'listing-domain-spring'
include 'listing-viewstore-persistence-spring'
include 'listing-common-spring'
include 'listing-api'
include 'listing-integration-test-spring'

// The existing Liquibase changelogs are reused unchanged (§6): this resources-only Gradle project
// points at the Maven module's directory. Its build output is redirected under the root build/
// directory (see root build.gradle), so Gradle writes nothing into the Maven module.
include 'listing-viewstore-liquibase'
project(':listing-viewstore-liquibase').projectDir = file('listing-viewstore/listing-viewstore-liquibase')
