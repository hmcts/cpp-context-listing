// Gradle build of the Spring Boot listing app (MBD refactor). The JEE Maven modules were deleted at
// P2.6. Module names follow §8 of docs/MBD_REFACTOR_PROMPT.md; the "-spring" suffix dates from when
// the Maven modules still held those directory names.
rootProject.name = 'cpp-context-listing'

include 'listing-domain-spring'
include 'listing-domain-event-spring'
include 'listing-viewstore-persistence-spring'
include 'listing-common-spring'
include 'listing-messaging'
include 'listing-xhibit'
include 'listing-command-spring'
include 'listing-api'
include 'listing-integration-test-spring'
include 'listing-integration-test-legacy'

// The viewstore Liquibase changelogs (resources only; moved from the Maven module at P2.6, unchanged).
include 'listing-viewstore-liquibase'
